# Every number the paper carries: id, value, label, source (file:field under paper/evidence/), text.
# claims.py resolves each against its evidence file, emits claims.tex, and fails the build on any
# unmapped number, missing file, value mismatch, or a non-measured claim phrased as measured.
claims:
