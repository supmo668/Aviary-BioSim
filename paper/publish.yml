# paper/publish.yml — per-project publish manifest (PUBLICATION_PIPELINE_SPEC.md §12.1).
# Prepared, nothing enabled: every venue is enabled: false until the principal's explicit go.
topic: v2r-biosim-whitepaper            # required, no default: names the asset folder
title: "The build loop as a lab method: an agentic worklist with independent tests, and a protein-model experiment run under it"
description: |
  A white paper for ML-focused computational biologists: a build loop in which the
  agent that writes code cannot record that it passed, taught as a lab method, with
  a protein-language-model experiment as the worked example and a failure-mode
  taxonomy from auditing the loop's own trust core. Every number is bound to an
  evidence file by a check that fails the build otherwise.
version: "0.1.0-draft"
license: "MIT"
related_url: "https://github.com/supmo668/Aviary-BioSim"
authors:
  - name: "Mang-yin Mo"
    orcid: "0009-0009-5233-3142"
    email: "mangyinm@alumni.cmu.edu"
    affiliation: "Independent researcher"   # principal-supplied 2026-09-28 (#456)
keywords: ["agentic build loop", "independent tests", "protein language model", "reproducibility", "failure modes", "mutation testing", "provenance"]
language: "eng"
# Domain category, so the record lands in the right discipline facets rather than nowhere.
# Mapped from the paper's own declared arXiv classes below (cs.LG primary, q-bio.QM
# cross-list) onto the OECD Fields of Science scheme that Zenodo indexes.
subjects:
  - { term: "Computer and information sciences", identifier: "https://www.oecd.org/science/inno/38235147.pdf?1", scheme: "oecd" }
  - { term: "Biological sciences", identifier: "https://www.oecd.org/science/inno/38235147.pdf?3", scheme: "oecd" }
# A machine-readable link back to the code the paper documents.
related_identifiers:
  - { relation: "isSupplementTo", identifier: "https://github.com/supmo668/Aviary-BioSim", resource_type: "software", scheme: "url" }
artifacts:
  - path: "main.pdf"
    description: "White paper PDF"
  - path: "evidence/"
    description: "Every number in the paper, with its producing configuration"
  - path: "claims.yaml"
    description: "Claims-traceability map (checked by claims.py at build time)"
  - path: "figures/"
    description: "Figures and the script that draws them from evidence/ only"
# Spec D6 requires a frozen repo snapshot in the deposit, so a reader of the DOI can reach the
# exact tree the evidence came from. The pipeline fetches this from GitHub at the pinned ref —
# it is not a file in the working tree, so it is declared apart from `artifacts`, whose paths
# the payload-safety tests require to exist on disk.
snapshot:
  source: "github-archive"
  repo: "supmo668/Aviary-BioSim"
  description: "Frozen source snapshot of the repository at the deposited ref (spec D6)"
notify:
  slack_channel: "#research-approvals"
venues:
  zenodo:
    # SANDBOX enabled 2026-10-13 by the principal, so the pipeline can be proven end to end
    # (spec §9 step 8 / §13.3: sandbox before any live deposit). A LIVE deposit still needs a
    # separate explicit go, and a test refuses any venue that is enabled without sandbox.
    enabled: true
    sandbox: true
    upload_type: "publication"
    publication_type: "preprint"
    zenodo_license: "mit"
  figshare: { enabled: false }
  osf: { enabled: false }
manual:
  arxiv:
    prepared_only: true               # no API; a human uploads the bundle
    primary: "cs.LG"
    cross_list: ["q-bio.QM"]
